<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Logo Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        #logo-3d-container {
            width: 100%;
            height: 100vh;
        }
        canvas {
            display: block;
        }
        .loading {
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="logo-3d-container">
        <canvas id="logo-3d-canvas"></canvas>
        <div id="loading-message" class="loading">Loading 3D Logo...</div>
    </div>

    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- GLTFLoader -->
    <script src="js/GLTFLoader.js"></script>

    <script>
        // Simple test to see if GLTFLoader works
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded');
            console.log('THREE exists:', typeof THREE !== 'undefined');
            console.log('THREE.GLTFLoader exists:', typeof THREE.GLTFLoader !== 'undefined');
            
            if (typeof THREE !== 'undefined' && typeof THREE.GLTFLoader !== 'undefined') {
                console.log('GLTFLoader is available, initializing scene...');
                
                // Initialize basic scene
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x000000);
                
                const camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                camera.position.z = 5;
                
                const canvas = document.getElementById('logo-3d-canvas');
                const renderer = new THREE.WebGLRenderer({ 
                    canvas: canvas,
                    antialias: true,
                    alpha: true
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                
                // Add lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 1);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                directionalLight.position.set(1, 1, 1);
                scene.add(directionalLight);
                
                // Try to load your GLB file
                const loader = new THREE.GLTFLoader();
                
                loader.load(
                    'images/your-logo-file.glb',
                    function(gltf) {
                        console.log('Model loaded successfully');
                        document.getElementById('loading-message').textContent = '3D Logo Loaded!';
                        
                        // Add model to scene
                        scene.add(gltf.scene);
                        
                        // Animation loop
                        function animate() {
                            requestAnimationFrame(animate);
                            
                            // Simple rotation animation
                            gltf.scene.rotation.x += 0.005;
                            gltf.scene.rotation.y += 0.005;
                            
                            renderer.render(scene, camera);
                        }
                        
                        animate();
                    },
                    function(progress) {
                        console.log('Loading progress:', (progress.loaded / progress.total * 100) + '%');
                    },
                    function(error) {
                        console.error('Error loading model:', error);
                        document.getElementById('loading-message').textContent = 'Error loading 3D Logo: ' + error;
                    }
                );
            } else {
                document.getElementById('loading-message').textContent = 'Three.js or GLTFLoader not available';
            }
        });
    </script>
</body>
</html>
